[project]
name = "pylightspeed"
version = "0.1.0"
description = "Python client for the Lightspeed POS and eCom APIs (R-Series, C-Series, X-Series, E-Series)"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylightspeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call the live Lightspeed API (require real credentials in .env)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "python-dotenv>=1.0",
]
